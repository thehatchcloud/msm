name: Run tests
on:
  push:
    branches-ignore:
      - 'gh-pages'
  pull_request:
    branches-ignore:
      - 'gh-pages'

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Verify pinned compatibility inventory
        run: ./scripts/verify-compatibility-baseline.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: sudo apt-get install shunit2
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Create the minecraft user
        run: sudo adduser --system --group --home /home/minecraft --shell /bin/bash minecraft
      - name: Run tests
        run: sudo /bin/bash ./test.sh
